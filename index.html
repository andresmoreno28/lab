<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Trusted Types, enforced: the pieces build their DOM with createElement and text nodes,
         so nothing may turn a string into HTML (no innerHTML, and no policy to allow it). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="require-trusted-types-for 'script'; trusted-types 'none'; object-src 'none'; base-uri 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lab · Andrés Moreno Rubio</title>
    <meta
      name="description"
      content="The nine interactive pieces of the lab at andresmoreno.dev: accessible components, experiments and tools in TypeScript and CSS, with no dependencies."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#121716" />
    <link rel="icon" href="data:," />
    <!-- The site's typefaces (SIL OFL), from Google Fonts: Playfair 2 at its SemiCondensed
         ExtraBold, Cabin at 87.5 % width, Fira Code Bold. Without them, system stacks. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cabin:wdth,wght@87.5,400..700&family=Fira+Code:wght@700&family=Playfair:opsz,wdth,wght@72,87.5,800&display=swap"
    />
    <script type="module" src="/main.ts"></script>
  </head>
  <body>
    <div id="app">
      <noscript>
        <p class="demo-noscript">
          The pieces are interactive and need JavaScript. Their code is on
          <a href="https://github.com/andresmoreno28/lab">GitHub</a>.
        </p>
      </noscript>
    </div>
  </body>
</html>
